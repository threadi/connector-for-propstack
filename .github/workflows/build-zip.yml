name: Build release zip

on:
    push:
        tags:
            - '*'
    workflow_dispatch:

# Least privileges by default; only the release job gets write access.
permissions:
    contents: read

jobs:
    tests:
        name: Run tests
        uses: ./.github/workflows/testing.yml

    build:
        name: Build release zip
        runs-on: ubuntu-latest
        env:
            REPO_NAME: ${{ github.event.repository.name }}
            REF_NAME: ${{ github.ref_name }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup WP-CLI
              uses: godaddy-wordpress/setup-wp-cli@80c9a89bd347082429795c0f12acf567e2c390d4 # 1.0.0

            - name: Run package installs and builds
              run: |
                  composer install
                  npm ci
                  npm run build:archive
                  npm run build:broker-field
                  npm run build:description
                  npm run build:energy_scale
                  npm run build:field
                  npm run build:filter
                  npm run build:single
                  npm run build:gallery
                  npm run build:lightbox
                  npm run copy:driver
                  rm -fr assets
                  rm -fr build
                  rm -fr releases
                  rm -fr svn
                  rm -fr languages
                  rm readme.md

            - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
              with:
                  upload-release-assets: false

            - name: Generate hook documentation
              run: vendor/bin/wp-documentor parse app --format=markdown --output=doc/hooks.md --prefix=cfprop_ --exclude=Transients.php

            - name: Generate autoloader
              run: composer dump-autoload -oa --no-dev

            - name: Run PHPStan check
              run:  vendor/bin/phpstan analyse

            - name: Run WordPress Coding Standard fixes
              run: vendor/bin/phpcbf .
              continue-on-error: true

            - name: Run WordPress Coding Standard checks
              run: vendor/bin/phpcs .

            - name: Set version number 1
              uses: richardrigutins/replace-in-files@bca25c5a547c8caa5e4db158b34ee8e8c7539ccf # v3.1.3
              with:
                  files: 'connector-for-propstack.php'
                  search-text: '@@VersionNumber@@'
                  replacement-text: ${{ github.ref_name }}

            - name: Set version number 2
              uses: richardrigutins/replace-in-files@bca25c5a547c8caa5e4db158b34ee8e8c7539ccf # v3.1.3
              with:
                  files: 'uninstall.php'
                  search-text: '@@VersionNumber@@'
                  replacement-text: ${{ github.ref_name }}

            - name: Set version number 3
              uses: richardrigutins/replace-in-files@bca25c5a547c8caa5e4db158b34ee8e8c7539ccf # v3.1.3
              with:
                  files: 'readme.txt'
                  search-text: '@@VersionNumber@@'
                  replacement-text: ${{ github.ref_name }}

            - name: Clean up
              run: |
                rm .gitattributes
                rm .gitignore
                rm .editorconfig
                rm -fr doc
                rm -fr bin
                rm dev-composer.sh
                rm dev-composer.json
                rm phpcs.xml.dist
                rm phpunit.xml.dist
                rm -fr tests
                rm -fr languages

            - name: Run PCP check
              uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
              with:
                  exclude-directories: |
                    app/Dependencies/easyTransientsForWordPress
                  ignore-codes: |
                    WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedConstantFound
                    github_directory
                  include-experimental: false
                  error-severity: 7
                  warning-severity: 6
                  include-low-severity-errors: true
                  slug: connector-for-propstack
              continue-on-error: true

            - name: Create ZIP release
              run: |
                ZIP_NAME="${REPO_NAME}_${REF_NAME}.zip"
                cd ..
                zip -rq "$ZIP_NAME" "$REPO_NAME/" -x "*/.git/*" "*/.github/*" "*/blocks/*/src/*" "*/docs/*" "*/phpcs.xml" "*/composer.lock" "*/package.json" "*/package-lock.json" "*/phpcs.xml.dist" "*/.gitignore" "*/vendor/*" "*/node_modules/*" "/.editorconfig" "*/assets/*" "*/phpstan.neon" "*/Taskfile.yml" "*/libs/*" "*/src/*" "*/dev-composer.json" "*/dev-composer.sh"
                zip -urq "$ZIP_NAME" "$REPO_NAME/vendor/autoload.php"
                zip -urq "$ZIP_NAME" "$REPO_NAME"/vendor/composer/*
                zip -urq "$ZIP_NAME" "$REPO_NAME/vendor/threadi/easy-setup-for-wordpress/lib/"
                zip -urq "$ZIP_NAME" "$REPO_NAME/vendor/threadi/easy-setup-for-wordpress/build/"
                zip -urq "$ZIP_NAME" "$REPO_NAME/vendor/threadi/crypt-for-wordpress/src/"
                zip -urq "$ZIP_NAME" "$REPO_NAME/vendor/threadi/easy-settings-for-wordpress/assets/"
                zip -urq "$ZIP_NAME" "$REPO_NAME/vendor/threadi/easy-settings-for-wordpress/build/"
                zip -urq "$ZIP_NAME" "$REPO_NAME/vendor/threadi/easy-settings-for-wordpress/src/"
                zip -urq "$ZIP_NAME" "$REPO_NAME/vendor/threadi/easy-dialog-for-wordpress/build/"
                cp "$ZIP_NAME" "$REPO_NAME/"

            # Smoke test the zip BEFORE it is published as release.
            - name: Smoke test the release zip in WordPress Playground
              run: |
                set -o pipefail
                ZIP_NAME="${REPO_NAME}_${REF_NAME}.zip"
                mkdir -p /tmp/smoke
                unzip -q "$ZIP_NAME" -d /tmp/smoke

                npx --yes @wp-playground/cli@3.1.56 run-blueprint \
                  --blueprint=./.github/blueprints/smoke.json \
                  --mount="/tmp/smoke/${REPO_NAME}:/wordpress/wp-content/plugins/${REPO_NAME}" \
                  --verbosity=debug \
                  --debug \
                  2>&1 | tee /tmp/smoke.log

                echo "----- Vollständiges Playground-Log -----"
                cat /tmp/smoke.log

                echo "----- Inhalt smoke-result.txt -----"
                cat "/tmp/smoke/${REPO_NAME}/smoke-result.txt" || echo "(File not found)"

                if ! grep -q "SMOKE_OK" "/tmp/smoke/${REPO_NAME}/smoke-result.txt"; then
                  echo "::error::SMOKE_OK not found in smoke-result.txt - check log above."
                  exit 1
                fi

            - name: Upload release zip
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: release-zip
                  path: ${{ github.event.repository.name }}_${{ github.ref_name }}.zip
                  if-no-files-found: error

    release:
        name: Create release
        runs-on: ubuntu-latest
        # only release if the tests and the smoke test of the zip were successful.
        needs: [ tests, build ]
        if: startsWith(github.ref, 'refs/tags/')
        permissions:
            contents: write
        steps:
            - name: Download release zip
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: release-zip

            - name: Create Release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                files: ${{ github.event.repository.name }}_${{ github.ref_name }}.zip
